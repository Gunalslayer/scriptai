<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel script generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F5F8;
    --surface: #FFFFFF;
    --ink: #161B26;
    --muted: #5C6475;
    --line: #DDE1E9;
    --accent: #2C4BFF;
    --accent-soft: #C9D2FF;
    --danger: #B3261E;
    --head: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --body: "DM Sans", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151C; --surface: #1A1E28; --ink: #EEF0F5; --muted: #98A0B3;
      --line: #2B303D; --accent: #7C93FF; --accent-soft: #33407F; --danger: #FF8A80;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.6 var(--body);
  }
  main { max-width: 640px; margin: 0 auto; padding: 56px 20px 96px; }

  h1 {
    font: 700 clamp(34px, 7vw, 52px)/1.05 var(--head);
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }
  .sub { color: var(--muted); margin: 0 0 40px; max-width: 46ch; }

  form { display: grid; gap: 18px; }
  label { display: grid; gap: 6px; font-weight: 500; font-size: 15px; }
  input, textarea {
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    width: 100%;
  }
  textarea { min-height: 112px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }
  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button {
    font: 500 16px/1 var(--body);
    border: 0;
    border-radius: 8px;
    padding: 15px 22px;
    cursor: pointer;
  }
  .primary { background: var(--accent); color: #fff; justify-self: start; }
  .primary:disabled { opacity: .6; cursor: progress; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .primary { color: #10131A; }
  }

  #error { color: var(--danger); margin: 16px 0 0; }
  #error:empty { display: none; }

  #result { margin-top: 56px; }
  #result[hidden] { display: none; }

  h2 { font: 700 22px/1.2 var(--head); letter-spacing: -0.01em; margin: 0 0 12px; }

  .audience { margin-bottom: 48px; }
  .audience p { margin: 0 0 12px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; list-style: none; }
  .tags li {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 14px;
  }

  /* 40-second timeline: the one memorable element */
  .timeline { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; }
  .timeline span:nth-child(1) { width: 12.5%; background: var(--accent); }
  .timeline span:nth-child(2) { width: 70%;   background: var(--accent-soft); }
  .timeline span:nth-child(3) { width: 17.5%; background: var(--ink); }
  .ticks { position: relative; height: 22px; margin: 6px 0 20px; font-size: 13px; color: var(--muted); }
  .ticks span { position: absolute; transform: translateX(-50%); }
  .ticks span:first-child { transform: none; }
  .ticks span:last-child { transform: translateX(-100%); }

  .part {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 8px 20px;
    padding: 20px 0;
    border-top: 1px solid var(--line);
  }
  .part h3 { font: 700 18px/1.3 var(--head); margin: 0; }
  .part .time { display: block; font: 400 13px/1.5 var(--body); color: var(--muted); margin-top: 2px; }
  .part p { margin: 0; white-space: pre-line; }
  @media (max-width: 520px) { .part { grid-template-columns: 1fr; } }

  .secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 12px 18px;
    margin-top: 8px;
  }
</style>
</head>
<body>
<main>
  <h1>Your 40-second reel script.</h1>
  <p class="sub">Tell us about your business. Get your target audience and a ready-to-shoot script.</p>

  <form id="form">
    <label>Business name
      <input id="name" required maxlength="80" placeholder="Sunrise Bakery">
    </label>
    <label>Product or service details
      <textarea id="details" required maxlength="600" placeholder="Fresh sourdough, eggless cakes and custom birthday orders. Home delivery within 5 km."></textarea>
    </label>
    <label>Location
      <input id="location" required maxlength="80" placeholder="Anna Nagar, Chennai">
    </label>
    <button class="primary" id="go" type="submit">Generate script</button>
  </form>
  <p id="error" role="alert"></p>

  <section id="result" hidden>
    <div class="audience">
      <h2>Target audience</h2>
      <p id="who"></p>
      <ul class="tags" id="tags"></ul>
    </div>

    <h2>Reel script</h2>
    <div class="timeline" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="ticks" aria-hidden="true">
      <span style="left:0">0s</span>
      <span style="left:12.5%">5s</span>
      <span style="left:82.5%">33s</span>
      <span style="left:100%">40s</span>
    </div>

    <div class="part"><h3>Hook<span class="time">0–5 sec</span></h3><p id="hook"></p></div>
    <div class="part"><h3>Content<span class="time">5–33 sec</span></h3><p id="content"></p></div>
    <div class="part"><h3>CTA<span class="time">33–40 sec</span></h3><p id="cta"></p></div>

    <button class="secondary" id="copy" type="button">Copy script</button>
  </section>
</main>

<script>
/* Calls your own Vercel function (api/generate.js). No key in the browser. */
async function generate(payload) {
  const res = await fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error("Request failed (" + res.status + ")");
  return res.json();
}

const $ = id => document.getElementById(id);
let current = null;

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("go");
  $("error").textContent = "";
  btn.disabled = true;
  btn.textContent = "Generating…";

  try {
    const out = await generate({
      name: $("name").value.trim(),
      details: $("details").value.trim(),
      location: $("location").value.trim()
    });

    $("who").textContent = out.audience.summary;
    const tags = $("tags");
    tags.innerHTML = "";
    out.audience.tags.forEach(t => {
      const li = document.createElement("li");
      li.textContent = t;
      tags.appendChild(li);
    });
    $("hook").textContent = out.script.hook;
    $("content").textContent = out.script.content;
    $("cta").textContent = out.script.cta;

    current = out.script;
    $("result").hidden = false;
    $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (err) {
    $("error").textContent = "Couldn't generate the script. Check your details and try again.";
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = "Generate script";
  }
});

$("copy").addEventListener("click", async () => {
  if (!current) return;
  const text = [current.hook, current.content, current.cta].join("\n\n");
  try {
    await navigator.clipboard.writeText(text);
    $("copy").textContent = "Copied";
  } catch {
    $("copy").textContent = "Copy failed";
  }
  setTimeout(() => { $("copy").textContent = "Copy script"; }, 1800);
});
</script>
</body>
</html>
